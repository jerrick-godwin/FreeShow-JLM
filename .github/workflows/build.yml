name: Ministry installers
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish; leave blank to build installers'
        required: false
        type: string
      artifact_run_id:
        description: 'Successful three-platform installer run to publish'
        required: false
        type: string
  workflow_call:
jobs:
  installer:
    if: ${{ !inputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            targets: nsis
            arch: x64
          - os: macos-15-intel
            platform: mac
            targets: dmg zip
            arch: x64
          - os: macos-15
            platform: mac
            targets: dmg zip
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies including native speech runtime
        run: npm ci --include=optional
      - name: Prepare and verify complete offline content
        run: npm run prepare:bundled
      - name: Test application
        run: npm run test:unit
      - name: Test packaging safeguards
        run: node --test scripts/offlinePackage.test.js
      - name: Build application
        run: npm run build
      - name: Build installer and verify installed payload
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config config/building/electron-builder.local.yaml --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Jesus-Lives-Ministry-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish verified installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python3 scripts/publishVerifiedRelease.py
