name: Ministry installers
on:
  workflow_dispatch:
  workflow_call:
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies including native speech runtime
        run: npm ci --include=optional
      - name: Prepare and verify complete offline content
        run: npm run prepare:bundled
      - name: Test packaging safeguards
        run: node --test scripts/offlinePackage.test.js
      - name: Build application
        run: npm run build
      - name: Build installer and verify installed payload
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config config/building/electron-builder.local.yaml --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Jesus-Lives-Ministry-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
